apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-api
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oficina-api
  template:
    metadata:
      # Unified Service Tagging do Datadog. É o unico jeito de o coletor
      # atribuir `service` e `env` aos logs de container: o log nao passa por
      # OTLP (OTEL_LOGS_EXPORTER=none em 02-api-configmap.yaml), então o agente
      # cai no nome da imagem, enquanto o APM, que le o resource OTel, reporta 
      # `oficina-mecanica-work-order-service`.
      # Dois nomes para a mesma aplicação quebram a aba Logs da pagina do
      # serviço e qualquer metrica derivada de log.
      #
      # São valores ESPELHADOS, não derivados: label do Kubernetes não
      # referencia ConfigMap. `service` tem de seguir igual a OTEL_SERVICE_NAME
      # e `env` igual a NODE_ENV, os dois em 02-api-configmap.yaml, de onde o
      # resource OTel tira service.name e deployment.environment.name. Mudou
      # la, muda aqui (não há verificacao automatica.)
      #
      labels:
        app.kubernetes.io/name: oficina-api
        app.kubernetes.io/part-of: oficina-mecanica
        tags.datadoghq.com/service: oficina-mecanica-work-order-service
        tags.datadoghq.com/env: production
    spec:
      # > janela de drain (10 s) + fechamento do servidor + $disconnect() +
      # margem. Estoura-lo e SIGKILL; mantido baixo de proposito, porque ele
      # alonga node drain e eviccao. Nao consome o rollout gate do CD: pods com
      # DeletionTimestamp saem da contagem de ativos do ReplicaSet.
      terminationGracePeriodSeconds: 40
      containers:
        - name: api
          image: IMAGE_URI_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: NODE_ENV

            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: PORT

            - name: JWT_EXPIRATION
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: JWT_EXPIRATION
 
            - name: JWT_REFRESH_EXPIRATION
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: JWT_REFRESH_EXPIRATION
 
            - name: BCRYPT_SALT_ROUNDS
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: BCRYPT_SALT_ROUNDS
 
            - name: MAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: MAIL_HOST
 
            - name: MAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: MAIL_PORT
 
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: TZ

            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: LOG_LEVEL

            - name: OTEL_SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: OTEL_SERVICE_NAME

            - name: OTEL_SERVICE_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: OTEL_SERVICE_NAMESPACE

            - name: TRUSTED_PROXY_CIDRS
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: TRUSTED_PROXY_CIDRS

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT

            - name: OTEL_LOGS_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: OTEL_LOGS_EXPORTER

            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: DATABASE_URL

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: JWT_SECRET
 
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: JWT_REFRESH_SECRET
 
            - name: CUSTOMER_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: CUSTOMER_JWT_PUBLIC_KEY

            - name: CUSTOMER_JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: CUSTOMER_JWT_ISSUER

            - name: CUSTOMER_JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: CUSTOMER_JWT_AUDIENCE
          startupProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            # 12 x 5 s = 60 s de orcamento, so para o boot da aplicacao: a
            # conexao do Prisma e preguicosa, entao nada de banco entra aqui.
            # Precisa continuar menor que o --timeout=180s do rollout gate do CD.
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            # 3 x 20 s = 60 s de tolerancia antes de reiniciar: apertar esse
            # produto converte soluco transitorio em reinicio. O
            # timeout de 5 s e quanto bloqueio do event loop se tolera sob
            # limits.cpu 500m, com o destino de log sincrono (ADR 0002).
            initialDelaySeconds: 0
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3000
            # timeoutSeconds > prazo proprio da verificacao (3,5 s) + margem de
            # rede. O prazo proprio, por sua vez, e maior que o
            # connectionTimeoutMillis do pool (3 s): um deadline menor mascararia
            # saturacao de pool como 'timeout' e apagaria a categoria 'pool'.
            # failureThreshold erra para o lado de demorar a retirar: como o RDS
            # e compartilhado, um valor baixo tiraria as 5 replicas de uma vez
            # numa oscilacao transitoria.
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
