apiVersion: batch/v1
kind: Job
metadata:
  name: JOB_NAME_PLACEHOLDER
  namespace: work-order
  labels:
    app.kubernetes.io/name: db-migrate-job
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  ttlSecondsAfterFinished: 1209600
  backoffLimit: 0
  template:
    metadata:
      # Datadog Unified Service Tagging, for the same reason as
      # `03-work-order-deployment.yaml`: container logs do not go through OTLP, so
      # without these labels the agent falls back to the image name and reports this
      # Job as `ecr-oficina-mecanica-app-repo` — a ghost service that is really
      # the same image as the API.
      #
      # `service` is deliberately DIFFERENT from the API's. Job and Deployment are
      # distinct workloads, with distinct lifecycles: unifying them would fill the
      # Logs tab of the API's service page with migration output on every
      # deploy, which is exactly what the Deployment labels were introduced
      # to avoid.
      #
      # `env` MIRRORS `NODE_ENV` in `02-work-order-configmap.yaml`, as in the
      # Deployment. Change it there, change it here (there is no automatic check).
      labels:
        app.kubernetes.io/name: db-migrate-job
        app.kubernetes.io/part-of: oficina-mecanica
        tags.datadoghq.com/service: oficina-mecanica-work-order-service-db-migrate
        tags.datadoghq.com/env: production
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: IMAGE_URI_PLACEHOLDER
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: DATABASE_URL

            - name: PRISMA_HIDE_UPDATE_MESSAGE
              value: "true"

          # `set -e` because the exit status of `sh -c` is the LAST command's:
          # without it, a failing migration followed by a passing seed makes the
          # Job end with **success**, and the CD moves on to the rollout with an
          # outdated schema.
          command:
            - sh
            - -c
            - |
              set -e
              npx prisma migrate deploy
              npx prisma db seed
