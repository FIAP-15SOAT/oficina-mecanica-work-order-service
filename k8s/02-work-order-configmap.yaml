apiVersion: v1
kind: ConfigMap
metadata:
  name: work-order-config
  namespace: work-order
  labels:
    app.kubernetes.io/name: work-order-service
    app.kubernetes.io/part-of: oficina-mecanica
data:
  NODE_ENV: production
  PORT: "3000"
  STAFF_JWT_ISSUER: "oficina-identity"
  STAFF_JWT_AUDIENCE: "oficina-services"
  MAIL_HOST: "mailhog.platform.svc.cluster.local"
  MAIL_PORT: "1025"
  TZ: "America/Sao_Paulo"
  LOG_LEVEL: "info"
  OTEL_SERVICE_NAME: "oficina-mecanica-work-order-service"
  OTEL_SERVICE_NAMESPACE: "oficina-mecanica"
  TRUSTED_PROXY_CIDRS: ""
  CUSTOMER_JWT_ISSUER: "oficina-customer-auth"
  CUSTOMER_JWT_AUDIENCE: "oficina-api"
  AWS_REGION: "us-east-1"
  WORK_ORDER_QUEUE_NAME: "work-order.fifo"
  # SNS does not resolve an ARN by name: the CD renders it with the account from `aws sts get-caller-identity`.
  MESSAGING_TOPIC_ARN: "${MESSAGING_TOPIC_ARN}"
  CACHE_TTL_SECONDS: "43200"
  INVENTORY_SERVICE_URL: "http://inventory-service.inventory.svc.cluster.local:3000"
  BILLING_SERVICE_URL: "http://billing-service.billing.svc.cluster.local:3000"
  IDENTITY_SERVICE_URL: "http://identity-service.identity.svc.cluster.local:3000"
  OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT}"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: "delta"
