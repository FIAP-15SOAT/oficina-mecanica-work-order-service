# Todos os Secrets do work-order. Cada passo do CD seleciona o seu documento com
# `yq 'select(.metadata.name == "<nome>")'`, preenche os placeholders e aplica por
# stdin. Os valores vão em `data:` (base64 numa linha só) porque o PEM multilinha
# da chave pública quebraria o YAML num `stringData` renderizado por envsubst.
apiVersion: v1
kind: Secret
metadata:
  name: jwt-private-keys
  namespace: work-order
  labels:
    app.kubernetes.io/name: work-order-service
    app.kubernetes.io/part-of: oficina-mecanica
type: Opaque
data:
  STAFF_JWT_PRIVATE_KEY: ${STAFF_JWT_PRIVATE_KEY_B64}
  STAFF_JWT_REFRESH_PRIVATE_KEY: ${STAFF_JWT_REFRESH_PRIVATE_KEY_B64}
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-public-keys
  namespace: work-order
  labels:
    app.kubernetes.io/name: work-order-service
    app.kubernetes.io/part-of: oficina-mecanica
type: Opaque
data:
  CUSTOMER_JWT_PUBLIC_KEY: ${CUSTOMER_JWT_PUBLIC_KEY_B64}
  STAFF_JWT_PUBLIC_KEY: ${STAFF_JWT_PUBLIC_KEY_B64}
  STAFF_JWT_KEY_ID: ${STAFF_JWT_KEY_ID_B64}
---
# Montado pelo CD a partir do endpoint do RDS e do secret gerenciado (AWSCURRENT).
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: work-order
  labels:
    app.kubernetes.io/name: work-order-service
    app.kubernetes.io/part-of: oficina-mecanica
type: Opaque
data:
  DATABASE_URL: ${DATABASE_URL_B64}
---
# Montado pelo CD a partir do endpoint do ElastiCache e do secret do auth token.
apiVersion: v1
kind: Secret
metadata:
  name: cache-credentials
  namespace: work-order
  labels:
    app.kubernetes.io/name: work-order-service
    app.kubernetes.io/part-of: oficina-mecanica
type: Opaque
data:
  CACHE_URL: ${CACHE_URL_B64}
