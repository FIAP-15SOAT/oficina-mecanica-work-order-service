apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: work-order-service-hpa
  namespace: work-order
  labels:
    app.kubernetes.io/name: work-order-service
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: work-order-service
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
