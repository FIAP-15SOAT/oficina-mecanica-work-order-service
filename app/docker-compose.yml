services:
  postgres:
    image: postgres:18-alpine
    container_name: techchallenge-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: techchallenge
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: techchallenge-api:local
    build: &api-build
      context: .
      args:
        DATABASE_URL: postgresql://postgres:postgres@postgres:5432/techchallenge?schema=public
    container_name: techchallenge-migrate
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/techchallenge?schema=public
      TZ: America/Sao_Paulo
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: techchallenge-api:local
    build: *api-build
    container_name: techchallenge-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/techchallenge?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-in-production}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      CUSTOMER_JWT_PUBLIC_KEY: ${CUSTOMER_JWT_PUBLIC_KEY:------BEGIN PUBLIC KEY-----\nMIIB...\n-----END PUBLIC KEY-----}
      CUSTOMER_JWT_ISSUER: ${CUSTOMER_JWT_ISSUER:-oficina-customer-auth}
      CUSTOMER_JWT_AUDIENCE: ${CUSTOMER_JWT_AUDIENCE:-oficina-api}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      TZ: America/Sao_Paulo
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    # > janela de drain (10 s) + fechamento do servidor + $disconnect() + margem.
    # O default do Compose e 10 s, que expira exatamente na virada da janela e
    # mata a API com SIGKILL antes de ela liberar o pool.
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: techchallenge-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  postgres_data:
