services:
  postgres:
    image: postgres:18-alpine
    container_name: techchallenge-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: techchallenge
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: techchallenge-api:local
    build: &api-build
      context: .
      args:
        DATABASE_URL: postgresql://postgres:postgres@postgres:5432/techchallenge?schema=public
    container_name: techchallenge-migrate
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/techchallenge?schema=public
      TZ: America/Sao_Paulo
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: techchallenge-api:local
    build: *api-build
    container_name: techchallenge-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/techchallenge?schema=public
      STAFF_JWT_PRIVATE_KEY: ${STAFF_JWT_PRIVATE_KEY:?Gere as chaves RS256 de funcionário conforme docs/local-setup.md}
      STAFF_JWT_PUBLIC_KEY: ${STAFF_JWT_PUBLIC_KEY:?Gere as chaves RS256 de funcionário conforme docs/local-setup.md}
      STAFF_JWT_KEY_ID: ${STAFF_JWT_KEY_ID:-staff-local}
      STAFF_JWT_ISSUER: ${STAFF_JWT_ISSUER:-oficina-identity}
      STAFF_JWT_AUDIENCE: ${STAFF_JWT_AUDIENCE:-oficina-services}
      STAFF_JWT_EXPIRATION: ${STAFF_JWT_EXPIRATION:-10m}
      STAFF_JWT_REFRESH_PRIVATE_KEY: ${STAFF_JWT_REFRESH_PRIVATE_KEY:?Gere as chaves RS256 de funcionário conforme docs/local-setup.md}
      STAFF_JWT_REFRESH_EXPIRATION: ${STAFF_JWT_REFRESH_EXPIRATION:-7d}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      CUSTOMER_JWT_PUBLIC_KEY: ${CUSTOMER_JWT_PUBLIC_KEY:------BEGIN PUBLIC KEY-----\nMIIB...\n-----END PUBLIC KEY-----}
      CUSTOMER_JWT_ISSUER: ${CUSTOMER_JWT_ISSUER:-oficina-customer-auth}
      CUSTOMER_JWT_AUDIENCE: ${CUSTOMER_JWT_AUDIENCE:-oficina-api}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      WORK_ORDER_QUEUE_NAME: work-order.fifo
      MESSAGING_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:oficina-events.fifo
      CACHE_URL: redis://:valkey@valkey:6379
      CACHE_TTL_SECONDS: 43200
      TZ: America/Sao_Paulo
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    # > janela de drain (10 s) + fechamento do servidor + $disconnect() + margem.
    # O default do Compose e 10 s, que expira exatamente na virada da janela e
    # mata a API com SIGKILL antes de ela liberar o pool.
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      valkey:
        condition: service_healthy

  localstack:
    image: localstack/localstack:4.14.0
    container_name: techchallenge-localstack
    restart: unless-stopped
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./localstack/init-topology.sh:/etc/localstack/init/ready.d/init-topology.sh:ro
    healthcheck:
      # Healthy only after the ready.d script created the topic and the queues.
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 5s
      timeout: 5s
      retries: 24

  valkey:
    image: valkey/valkey:9.1
    container_name: techchallenge-valkey
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "valkey"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "valkey", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: techchallenge-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  postgres_data:
