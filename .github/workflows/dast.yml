name: DAST

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: dast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE_FILE: app/docker-compose.yml:app/docker-compose.dast.yml
  COMPOSE_PROJECT_NAME: dast
  API_BASE_URL: http://localhost:3000
  STAFF_JWT_KEY_ID: staff-dast
  # Canonical ADMIN user (docs/seed-ids.md): a UUID sub, because it is stored in uuid columns such as status_history.changed_by_id.
  STAFF_ADMIN_ID: 1c905c27-4c5e-4d85-a53d-914ed8b87bbe
  STAFF_ADMIN_EMAIL: guilhermedarochasalvador@gmail.com
  STAFF_ADMIN_NAME: Guilherme da Rocha Salvador
  STAFF_JWT_ISSUER: oficina-identity
  STAFF_JWT_AUDIENCE: oficina-services
  # Canonical id of the seeded customer user joao.silva@email.com (prisma/seeds/seed-ids.ts).
  CUSTOMER_USER_ID: 212ca9d7-fa8f-4111-9746-d431da68b063
  STACK_WAIT_TIMEOUT: 180

jobs:
  zap-scan:
    name: OWASP ZAP API Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Ephemeral key pair, generated on every run — never committed. Isolates
      # the /api/me/* scan from the external Lambda (out of scope): the job
      # signs its own customer tokens, exactly as the E2E tests do with
      # test/helpers/customer-jwt.helper.ts.
      - name: Generate an ephemeral RS256 key pair for the customer auth flow
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/customer-jwt.key
          openssl rsa -in /tmp/customer-jwt.key -pubout -out /tmp/customer-jwt.pub
          echo "CUSTOMER_JWT_PUBLIC_KEY=$(awk 'NF {sub(/\r/, ""); printf "%s\\n", $0}' /tmp/customer-jwt.pub)" >> "$GITHUB_ENV"

      # Ephemeral key pair, generated on every run and never committed. The job
      # plays the role of Identity: it signs an ADMIN access token with the
      # private key and gives the service only the public key. The private key
      # is deleted right after signing.
      - name: Generate an ephemeral RS256 key pair and sign an ADMIN staff token
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/staff-jwt"
          mkdir -p "$key_dir"
          trap 'rm -rf "$key_dir"' EXIT

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$key_dir/private.pem"
          openssl pkey -in "$key_dir/private.pem" -pubout -out "$key_dir/public.pem"

          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }

          now="$(date +%s)"
          # One hour, not the ten minutes of a real access token: it is signed
          # before the stack starts, and the whole run takes about nine minutes.
          exp="$((now + 3600))"
          header="{\"alg\":\"RS256\",\"typ\":\"JWT\",\"kid\":\"${STAFF_JWT_KEY_ID}\"}"
          payload="{\"sub\":\"${STAFF_ADMIN_ID}\",\"email\":\"${STAFF_ADMIN_EMAIL}\",\"name\":\"${STAFF_ADMIN_NAME}\",\"role\":\"ADMIN\",\"typ\":\"access\",\"iss\":\"${STAFF_JWT_ISSUER}\",\"aud\":\"${STAFF_JWT_AUDIENCE}\",\"iat\":${now},\"exp\":${exp}}"

          signing_input="$(printf '%s' "$header" | b64url).$(printf '%s' "$payload" | b64url)"
          signature="$(printf '%s' "$signing_input" | openssl dgst -sha256 -sign "$key_dir/private.pem" | b64url)"
          rm -f "$key_dir/private.pem"
          token="${signing_input}.${signature}"

          echo "::add-mask::$token"
          {
            echo "STAFF_JWT_PUBLIC_KEY=$(awk 'NF {sub(/\r/, ""); printf "%s\\n", $0}' "$key_dir/public.pem")"
            echo "ZAP_AUTH_HEADER_VALUE=Bearer $token"
          } >> "$GITHUB_ENV"

      - name: Start the target stack and wait for it to become healthy
        run: |
          if ! docker compose up -d --build --wait --wait-timeout "$STACK_WAIT_TIMEOUT"; then
            echo "::error::The stack did not become healthy within ${STACK_WAIT_TIMEOUT}s."
            docker compose ps --all
            docker compose logs --no-color --tail 200
            exit 1
          fi

      # The external Lambda is out of scope (see docs/testing.md). The job
      # signs its own customer token with the private key generated above,
      # for the seeded customer user — the same role the Lambda would play.
      - name: Sign an ephemeral customer JWT for the external scan pass
        run: |
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }

          now="$(date +%s)"
          exp="$((now + 3600))"
          header='{"alg":"RS256","typ":"JWT"}'
          payload="{\"sub\":\"${CUSTOMER_USER_ID}\",\"iss\":\"oficina-customer-auth\",\"aud\":\"oficina-api\",\"iat\":${now},\"exp\":${exp}}"

          header_b64="$(printf '%s' "$header" | b64url)"
          payload_b64="$(printf '%s' "$payload" | b64url)"
          signing_input="${header_b64}.${payload_b64}"
          signature="$(printf '%s' "$signing_input" | openssl dgst -sha256 -sign /tmp/customer-jwt.key | b64url)"
          token="${signing_input}.${signature}"

          echo "::add-mask::$token"
          echo "CUSTOMER_ZAP_AUTH_HEADER_VALUE=Bearer $token" >> "$GITHUB_ENV"

      - name: Prepare the ZAP work directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/zap-work"
          cp .zap/rules.tsv "$GITHUB_WORKSPACE/zap-work/rules.tsv"
          chmod -R 777 "$GITHUB_WORKSPACE/zap-work"

      - name: Run OWASP ZAP API scan — internal (Admin) auth
        run: |
          # ZAP 2.17.0 (stable) pinned by digest — bump with: docker buildx imagetools inspect ghcr.io/zaproxy/zaproxy:stable
          docker run --rm \
            --network "${COMPOSE_PROJECT_NAME}_default" \
            -v "$GITHUB_WORKSPACE/zap-work:/zap/wrk:rw" \
            -e ZAP_AUTH_HEADER=Authorization \
            -e ZAP_AUTH_HEADER_VALUE="$ZAP_AUTH_HEADER_VALUE" \
            ghcr.io/zaproxy/zaproxy@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2 \
            zap-api-scan.py \
              -t http://api:3000/api/docs-json \
              -f openapi \
              -c rules.tsv \
              -r zap-report.html \
              -J zap-report.json

      - name: Upload the internal-auth ZAP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-report
          path: |
            zap-work/zap-report.html
            zap-work/zap-report.json
          if-no-files-found: warn

      # Second pass: same ephemeral stack, authenticated as a workshop customer
      # (customer-jwt) — covers /api/me/* beyond the 401 the staff pass always
      # gets from those routes.
      - name: Run OWASP ZAP API scan — external (Customer) auth
        run: |
          docker run --rm \
            --network "${COMPOSE_PROJECT_NAME}_default" \
            -v "$GITHUB_WORKSPACE/zap-work:/zap/wrk:rw" \
            -e ZAP_AUTH_HEADER=Authorization \
            -e ZAP_AUTH_HEADER_VALUE="$CUSTOMER_ZAP_AUTH_HEADER_VALUE" \
            ghcr.io/zaproxy/zaproxy@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2 \
            zap-api-scan.py \
              -t http://api:3000/api/docs-json \
              -f openapi \
              -c rules.tsv \
              -r zap-report-customer.html \
              -J zap-report-customer.json

      - name: Upload the external-auth ZAP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-report-customer
          path: |
            zap-work/zap-report-customer.html
            zap-work/zap-report-customer.json
          if-no-files-found: warn

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
