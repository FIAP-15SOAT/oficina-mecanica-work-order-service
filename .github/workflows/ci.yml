name: CI

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  AWS_REGION: us-east-1
  # Fake URL: `prisma generate` only parses it, never connects. Overridable via a repo variable.
  PRISMA_GENERATE_DATABASE_URL: ${{ vars.PRISMA_GENERATE_DATABASE_URL || 'postgresql://prisma:prisma@localhost:5432/prisma?schema=public' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci
        with:
          node-version: ${{ env.NODE_VERSION }}
          database-url: ${{ env.PRISMA_GENERATE_DATABASE_URL }}
      - name: Lint
        working-directory: app
        run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci
        with:
          node-version: ${{ env.NODE_VERSION }}
          database-url: ${{ env.PRISMA_GENERATE_DATABASE_URL }}
      - name: Unit tests with coverage
        working-directory: app
        run: npm run test:cov

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci
        with:
          node-version: ${{ env.NODE_VERSION }}
          database-url: ${{ env.PRISMA_GENERATE_DATABASE_URL }}
      - name: E2E tests with coverage
        working-directory: app
        run: npm run test:e2e:cov

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci
        with:
          node-version: ${{ env.NODE_VERSION }}
          database-url: ${{ env.PRISMA_GENERATE_DATABASE_URL }}
      - name: Build
        working-directory: app
        run: npm run build

      - name: Telemetry preload smoke
        working-directory: app
        run: npm run test:smoke

  db-validation:
    name: DB Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: techchallenge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci
        with:
          node-version: ${{ env.NODE_VERSION }}
          database-url: ${{ env.PRISMA_GENERATE_DATABASE_URL }}
      # Ephemeral DB only: db:reset (migrate reset + seed) proves migrations apply
      # from empty and the seed runs. The Postgres service container is discarded
      # with the job — this never touches a real database.
      - name: Reset and seed the throwaway database
        working-directory: app
        run: npm run db:reset
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/techchallenge?schema=public

  open-pr:
    name: Open Pull Request
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-tests
      - e2e-tests
      - build
      - db-validation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@21cfef2b496dd8ef5b904c159339626a10ad380e # v1.11.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Open a PR to main if none exists
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "${HEAD_BRANCH}" --base main --state open --json number --jq 'length')"
          if [[ "${existing}" != "0" ]]; then
            echo "An open PR already exists for ${HEAD_BRANCH} -> main; nothing to do."
            exit 0
          fi
          gh pr create \
            --base main \
            --head "${HEAD_BRANCH}" \
            --title "${HEAD_BRANCH}" \
            --body "Automated PR opened by CI on behalf of @${ACTOR} after all checks passed on \`${HEAD_BRANCH}\`."
