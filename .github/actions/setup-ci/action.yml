name: Setup CI
description: >-
  Prepare a CI job: set up Node with npm caching, install dependencies, and
  generate the Prisma client (all from app/). The caller MUST check out the
  repository first, since a local composite action can only run after checkout.

inputs:
  node-version:
    description: Node.js version to set up
    required: false
    default: "24"
  database-url:
    description: >-
      Throwaway DATABASE_URL used only so `prisma generate` can parse it. It is
      never connected to — a fake value is enough.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: app/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: app
      run: npm ci

    - name: Generate Prisma client
      shell: bash
      working-directory: app
      run: npm run prisma:generate
      env:
        DATABASE_URL: ${{ inputs.database-url }}
